# El método de fable como prosa (exp/72 F0; era DIRECTIVA_FABLE, opt-in con
# PROMPT_FABLE). Destilado de Sahir619/fable-method @9924067 (MIT). Texto sin
# cambios (fase 5b, decisión del operador: medirla como skill antes de borrarla).
id: metodo-fable
descripcion: "tareas con riesgo de equivocarse de acción: un test que falla y contradice la spec, una evaluación donde no hay que editar, o acciones irreversibles (deploy, push, borrar)"
instrucciones: >
  Antes de actuar, clasificá el pedido: pregunta/assessment (solo hallazgos y una
  recomendación, no edites), tarea (cambio verificado) o plan-first (alcance ambiguo o
  acción irreversible: plan y esperá aprobación). Definí en una línea qué significa
  "hecho" y cómo se verifica. Evidencia de fuentes primarias (leé el archivo real; no
  cites de memoria); dos rondas de búsqueda alcanzan. Una sola recomendación. Antes de
  cambiar comportamiento escribí `INTENT: el código hace X; el check espera Y; la spec
  dice Z`; si X/Y/Z no coinciden, el desacuerdo es el hallazgo: no edites. Para acciones
  outward (deploy, push, publicar, borrar datos compartidos) escribí `AUTH: el usuario
  dijo "..."`; sin cita, no actúes y dejala como próximo paso. Cambio mínimo y quirúrgico.
  Verificá observando (correr, no inferir) el criterio de hecho y el sistema alrededor; si
  arreglaste un defecto, buscá el mismo patrón en todo el repo y escribí `TWINS: busqué
  <patrón> — encontré N sitios: <archivos o none>`. Máximo 3 ciclos de fix-verify; si no,
  parás y reportás lo intentado. Reportá outcome-first, en lenguaje llano, con caveats
  honestos, y `PENDING: <acción> — esperando tu autorización` si un follow-up prescripto
  no se hizo.
