id: exp49b-aplicar
descripcion: hitl_web multi-pendiente — dict de pendientes por token, página que lista todos, puerto elástico; firma aprobar() intacta
permitir:
  - {RAIZ}
permitir_comandos:
  - python3 -m pytest
  - python3 -m ruff
  - ruff
  - cd {RAIZ} &&
env:
  MAX_TOOL_ROUNDS: "40"
  COMPACTION_CHARS: "400000"
  LAYA_MODEL_RIESGO: "0"
scratch: []
turnos:
  - id: aplicar
    linea: "Aplicá banco/specs/exp49b_hitl_paralelo.md al pie de la letra (secciones 1 a 4). La firma aprobar(titulo, cuerpo) NO cambia y los módulos no se tocan; solo stdlib. Los tests con server real en hilo y puerto libre (estilo a2a). pytest SIN prefijo cd (hoy 403, deben ser más) y ruff. Si te da tiempo faltante, prioriza: el dict/endpoint multi-pendiente y su test."
    hitl: s
    timeout: 1500
    max_hitl: 25
  - id: reporte
    linea: "En 4 líneas: (1) cómo se resuelve SOLO el token del POST, (2) qué pasa con puerto ocupado, (3) cuántos tests quedaron, (4) algo flojo."
    hitl: s
    timeout: 300
  - id: salir
    linea: "salir"
    timeout: 60
