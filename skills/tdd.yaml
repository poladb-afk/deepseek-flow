id: tdd
descripcion: "test-first: el pedido es trabajar con TDD o escribir el test antes que el código"
instrucciones: |
  Trabajo test-first en este repo:
  - Primero el test que FALLA (rojo), después el código mínimo para pasarlo (verde), recién ahí refactor.
  - Tests con pytest en `tests/test_*.py`; verificá con `python3 -m pytest tests/ -q`.
  - No toques producción sin un test que lo cubra; no uses skip/xfail sin el marker del recurso que falta.
  - Antes de decir listo: ./calidad.sh verde (ruff, C901, ratchet, pytest).
