# Tercera sesión de exp/7: el harness aplica tests + documentación + fixes.
id: exp7-docs
descripcion: tests de sonda_laya + sección design.md + fixes de exactitud
scratch: []
turnos:
  - id: aplicar
    linea: "Leé banco/specs/exp7_docs_tests.md entero y aplicalo exactamente: son 4 operaciones (crear tests/test_sonda_laya.py, corregir UN comentario en sonda_laya.py, insertar la sección en docs/design.md con el texto textual dado, y 2 ediciones de exactitud en utils/laya.py y .env.example). Todo el contenido ya está escrito en la spec — no inventes ni parafrasees nada."
    hitl: s
    timeout: 600
  - id: gate
    linea: "Corré ./calidad.sh y reportá el resultado. No corrijas nada, solo reportá."
    hitl: s
    timeout: 300
  - id: salir
    linea: "salir"
    timeout: 60
