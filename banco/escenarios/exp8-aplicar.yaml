id: exp8-aplicar
descripcion: el harness aplica la compuerta por datos + split del veto + docs
scratch: []
turnos:
  - id: aplicar
    linea: "Leé banco/specs/exp8_aplicar.md entero y aplicá las 6 operaciones exactamente como están: 2 ediciones de código (utils/laya.py, nodes.py), 1 bloque en .env.example, 1 test nuevo al final de tests/test_smoke.py, 1 sección en docs/design.md y 1 append en docs/roadmap.md. Todos los textos están dados textuales — cero paráfrasis."
    hitl: s
    timeout: 600
  - id: gate
    linea: "Corré ./calidad.sh y reportá el resultado sin corregir nada."
    hitl: s
    timeout: 300
  - id: salir
    linea: "salir"
    timeout: 60
