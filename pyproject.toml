# Base de calidad de deepseek-flow (2026-10-06).
#
# El gate completo corre con ./calidad.sh: higiene ruff · C901 · ratchet ·
# pytest · cobertura por archivo · tipos con Pyright (X184). Determinista,
# sin LLM.

[project]
name = "deepseek-flow"
version = "0.1.0"
description = "Agente de terminal sobre PocketFlow con decisiones locales (Laya)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
# artefactos y bibliotecas no versionadas: nada que auditar acá
exclude = [
    ".runs",
    ".modelos",
    ".heartbeat",
    "rag_index",
    "salidas",
    "memoria",
    "heartbeat",
    # material de auditoría externa (informes, evidencia y su script de un solo
    # uso): no es código del harness, su lint no dice nada del proyecto y sin
    # este exclude calidad.sh quedaba rojo por 91 incidencias de ese script.
    "docs/informes",
    # fixtures del bench exp/72: eval externo de fable-method (MIT), datos de un
    # benchmark, no código del harness — su lint no dice nada del proyecto.
    "banco/fable/escenarios",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (muerto/sin uso), B bugbear (bugs comunes),
# I imports, C4 comprehensions, SIM simplificaciones, UP modernización.
select = ["E", "W", "F", "B", "I", "C4", "SIM", "UP"]
ignore = [
    # El proyecto documenta el PORQUÉ en comentarios largos (ley medida,
    # patrón medido en producción): reformatarlos sería perder señal.
    "E501",
    # El if/else explícito gana al ternario de una línea en las rutas de
    # fs_tools (resolución de rutas permitidas: se lee auditando).
    "SIM108",
]

[tool.coverage.run]
# X175: los datos de la etapa 4 de calidad.sh (ignorados por git).
data_file = ".cobertura/datos"

[tool.pyright]
# X184: etapa 6/6 del gate. La versión de Pyright está pinneada en
# requirements-dev.txt y el target de Python es FIJO (3.12): el resultado no
# depende del intérprete que corre (CI 3.12; la máquina local puede ser otra).
# El alcance es el PRODUCTO (el mismo conjunto que lineas_del_producto): el
# laboratorio no entra.
# `reportMissingImports = "none"`: las dependencias opcionales (laya,
# fastembed, ddgs, fastmcp) están instaladas en algunas máquinas y en el CI
# no, y su ausencia no es un error de tipos del producto.
include = [
    "main.py", "flow.py", "nodes.py", "supervisor.py",
    "informe.py", "juez.py", "juez_lote.py", "fable_judge.py", "auditoria.py",
    "research.py", "debate.py", "rag.py", "delegar.py", "heartbeat.py",
    "resume.py", "mcp_server.py", "visor.py", "effective_n.py",
    "utils", "modules",
]
# El exclude deja afuera lo mismo que lineas_del_producto: el laboratorio
# (banco/, tests/, fable/) y los artefactos. Un archivo importado desde el
# producto no puede arrastrar diagnósticos de laboratorio al gate.
exclude = [
    "banco", "tests", "docs", "fable", "salidas", "memoria", "rag_index",
    ".runs", ".modelos", ".pyright", ".cobertura", ".hypothesis", ".venv",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "none"
# Los stubs propios solo cubren la dependencia OPCIONAL `laya`: así el número
# de errores no cambia según qué opcionales tenga instaladas la máquina.
stubPath = "./typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Por qué un test se saltea: el marker dice el RECURSO, el skip su motivo.
# Correr el subconjunto determinista:
#   pytest -m "not laya and not red and not datos and not git"
markers = [
    "laya: requiere el paquete laya y un checkpoint local",
    "red: requiere red o dependencias opcionales (ddgs, fastmcp)",
    "datos: requiere artefactos locales ya generados (trazas.db, evidencia de sondas)",
    "git: requiere git (algunos tests, además, el repo inicializado: ver tests/conftest.py)",
    "cobertura: maneja su propio colector de coverage: corre en la pasada sin medición (X175)",
]
