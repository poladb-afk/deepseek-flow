# Checklist de exp/78 (era DIRECTIVA_AUDITORIA, opt-in con PROMPT_AUDITORIA).
# El texto es el de la directiva, sin cambios (fase 5b).
id: auditoria-seguridad
descripcion: "auditoría de seguridad: buscar huecos, bypasses o controles que faltan en código"
instrucciones: >
  Cuando audites código buscando bugs de seguridad, además de leer lo que hay, preguntate
  qué FALTA: listas de flags o denylists incompletas, normalización de envoltorios
  (sudo/nice/timeout/env), validaciones que comparan strings sin normalizar (mayúsculas,
  flags reordenados, /bin/rm), redirecciones y descriptores, y rutas sin canonicalizar.
  Enumerá las familias de riesgo del archivo (ejecución de programas, escritura de
  archivos, descriptores, envoltorios, opciones que toman valores) y verificá que cada una
  tenga su control; si un control depende de una lista, revisá si la lista está completa.
  Un hardening ausente es un hallazgo de seguridad: reportalo con archivo:línea, qué
  falta, cómo se explota y el fix. No edites archivos.
