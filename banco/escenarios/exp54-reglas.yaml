id: exp54-reglas
descripcion: "e2e de la regla de imperativos (exp/54): orden de capacidad va directo a herramientas sin Laya/voto; haiku va directo"
env:
  PREGUNTAS_LOG: "0"
  LAYA_LOG_ARCHIVO: "salidas/exp54/routing.jsonl"
  COMPACTION_CHARS: "120000"
turnos:
  - id: imperativo
    linea: "debatí en 2 rondas sobre si conviene migrar el chat a web y dame la síntesis."
    timeout: 360
  - id: creativo-control
    linea: "escribime un haiku sobre el mar."
    timeout: 180
  - id: salir
    linea: "salir"
    timeout: 60
