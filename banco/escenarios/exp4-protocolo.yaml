# Demostración del protocolo de continuación: tarea de ~3 rondas
# DEPENDIENTES (ls → leer el primero → escribir) con presupuesto 2: la nota
# llega en la ronda 1, el modelo debe cerrar honesto y pedir continuación,
# y el turno siguiente ("seguí") completa con presupuesto reiniciado.
id: exp4-protocolo
descripcion: protocolo de continuación con tope 2
env:
  MAX_TOOL_ROUNDS: "2"
permitir:
  - /home/roquedb/Documentos/00_IA/Pocketflow/deepseek-flow/prueba_rondas
scratch:
  - prueba_rondas
turnos:
  - id: tarea-dependiente
    linea: "Corré ls banco/escenarios; después leé las primeras 30 líneas del PRIMER archivo alfabético de esa lista; después creá prueba_rondas/informe.txt con el nombre de ese archivo y su primera línea de comentario."
    hitl: s
    timeout: 300
  - id: continuar
    linea: "seguí — terminá la tarea con el presupuesto reiniciado"
    hitl: s
    timeout: 240
  - id: salir
    linea: "salir"
    timeout: 60
