name: calidad

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2: la guardia anti-bypass del ratchet compara el baseline
      # commiteado (HEAD) contra el anterior (HEAD~1); con el default 1 no puede.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt = runtime (requirements.txt) + pytest + ruff
      # pinneado. Las opcionales (laya, fastembed, fastmcp, ddgs) quedan
      # afuera: la suite las saltea o las simula.
      - run: pip install -r requirements-dev.txt
      # OJO: no forzar TRACE=0 ni THREAD_PERSIST=0. Los tests de persistencia y
      # de traza los encienden ellos mismos, y apagarlos desde el entorno deja
      # 10 rojos (medido). PREGUNTAS_LOG=0 alcanza para no escribir artefactos.
      - run: ./calidad.sh
        env:
          PREGUNTAS_LOG: "0"
