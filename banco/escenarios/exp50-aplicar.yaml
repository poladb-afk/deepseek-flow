id: exp50-aplicar
descripcion: pre-fetch declarativo — la regla de archivos mencionados como política del chat, con respeto por el router y los invariantes
permitir:
  - {RAIZ}
permitir_comandos:
  - python3 -m pytest
  - python3 -m ruff
  - ruff
  - cd {RAIZ} &&
env:
  MAX_TOOL_ROUNDS: "40"
  COMPACTION_CHARS: "400000"
  LAYA_MODEL_RIESGO: "0"
scratch: []
turnos:
  - id: aplicar
    linea: "Aplicá banco/specs/exp50_prefetch.md al pie de la letra (secciones 1 a 5). CRÍTICO la sección 3: el mensaje [pre-fetch] entra ANTES del router y LayaRouter.prep debe saltear los mensajes prefetch para leer la PREGUNTA real (ese fix es parte del experimento). Reusá el resolvedor de contención existente, no lo reimplementes. pytest SIN prefijo cd (hoy 392, deben ser más) y ruff."
    hitl: s
    timeout: 1800
    max_hitl: 25
  - id: reporte
    linea: "En 4 líneas: (1) la regla v1 y sus topes, (2) cómo evitaste que el router lea el mensaje prefetch como pregunta, (3) cuántos tests quedaron, (4) algo flojo."
    hitl: s
    timeout: 300
  - id: salir
    linea: "salir"
    timeout: 60
